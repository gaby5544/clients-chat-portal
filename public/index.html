<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quantum Secure Escrow Desk</title>
  <script src="/socket.io/socket.io.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #020617;
      --panel-bg: rgba(15, 23, 42, 0.85);
      --accent-cyan: #38bdf8;
      --accent-emerald: #10b981;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
      --accent-indigo: #6366f1;
      --border: rgba(56, 189, 248, 0.2);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }

    body {
      background: var(--bg-dark);
      background-image: 
        radial-gradient(at 10% 10%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
        radial-gradient(at 90% 90%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
        radial-gradient(at 50% 50%, #020617 0px, #000 100%);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .room-container {
      width: 100%;
      max-width: 1000px;
      height: 820px;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.9), 0 0 40px rgba(56, 189, 248, 0.08);
      backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Redesigned Header */
    .header {
      padding: 20px 28px;
      background: rgba(2, 6, 23, 0.95);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .vault-icon {
      width: 42px;
      height: 42px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--accent-cyan);
      font-size: 1.2rem;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #fff 30%, var(--accent-cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .status-badge {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent-emerald);
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.25);
      padding: 6px 14px;
      border-radius: 30px;
    }

    .pulse {
      width: 8px;
      height: 8px;
      background-color: var(--accent-emerald);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent-emerald);
    }

    /* Pinned Bar */
    .pinned-bar {
      background: rgba(245, 158, 11, 0.08);
      border-bottom: 1px solid rgba(245, 158, 11, 0.2);
      padding: 10px 28px;
      font-size: 0.85rem;
      color: var(--accent-amber);
      display: none;
      align-items: center;
      gap: 10px;
    }

    /* Admin Panel */
    .admin-tools {
      background: rgba(15, 23, 42, 0.95);
      padding: 12px 28px;
      border-bottom: 1px solid var(--border);
      display: none;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .admin-label {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--accent-amber);
      margin-right: 8px;
    }

    .admin-btn {
      background: rgba(244, 63, 94, 0.1);
      border: 1px solid rgba(244, 63, 94, 0.3);
      color: #fda4af;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.78rem;
      transition: all 0.2s;
    }

    .admin-btn:hover { background: rgba(244, 63, 94, 0.25); }

    .admin-btn-accent {
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--accent-cyan);
    }
    .admin-btn-accent:hover { background: rgba(56, 189, 248, 0.25); }

    /* Chat Body */
    .chat-messages {
      flex: 1;
      padding: 28px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .message {
      max-width: 75%;
      padding: 14px 18px;
      border-radius: 16px;
      font-size: 0.92rem;
      line-height: 1.5;
      position: relative;
    }

    .msg-system {
      align-self: center;
      background: rgba(56, 189, 248, 0.05);
      border: 1px solid rgba(56, 189, 248, 0.15);
      color: var(--text-muted);
      font-size: 0.78rem;
      text-align: center;
      border-radius: 30px;
      padding: 8px 20px;
    }

    .msg-admin {
      align-self: flex-start;
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-top-left-radius: 4px;
    }

    .msg-party {
      align-self: flex-end;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-top-right-radius: 4px;
    }

    .sender-tag {
      font-size: 0.72rem;
      font-weight: 800;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .time-tag {
      font-size: 0.65rem;
      color: var(--text-muted);
      margin-top: 6px;
      text-align: right;
    }

    .msg-action-bar {
      position: absolute;
      top: 8px;
      right: 12px;
      display: flex;
      gap: 8px;
    }

    .action-icon-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.75rem;
      transition: color 0.2s;
    }

    .action-icon-btn:hover { color: #fff; }

    /* Footer */
    .footer-controls {
      padding: 20px 28px;
      background: rgba(2, 6, 23, 0.95);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .role-dropdown, .file-btn-label, .admin-login-btn {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      color: var(--accent-cyan);
      padding: 12px 16px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .role-dropdown:hover, .file-btn-label:hover {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.15);
    }

    .admin-login-btn {
      background: rgba(245, 158, 11, 0.08);
      border-color: rgba(245, 158, 11, 0.25);
      color: var(--accent-amber);
    }
    .admin-login-btn:hover { background: rgba(245, 158, 11, 0.2); }

    .message-input {
      flex: 1;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      color: #fff;
      padding: 12px 18px;
      border-radius: 12px;
      outline: none;
      font-size: 0.95rem;
      transition: border-color 0.2s;
    }

    .message-input:focus {
      border-color: var(--accent-cyan);
    }

    .send-btn {
      background: linear-gradient(135deg, var(--accent-cyan) 0%, var(--accent-indigo) 100%);
      color: #020617;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 800;
      cursor: pointer;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: opacity 0.2s;
    }

    .send-btn:hover { opacity: 0.9; }

    .file-input { display: none; }

    .file-card {
      margin-top: 10px;
      padding: 10px 14px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .file-card a {
      color: var(--accent-cyan);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="room-container">
    <!-- Redesigned Header -->
    <div class="header">
      <div class="brand-group">
        <div class="vault-icon"><i class="fa-solid fa-shield-halved"></i></div>
        <div>
          <div class="brand-title">QUANTUM SECURE ESCROW DESK</div>
          <div class="brand-subtitle">Encrypted Multi-Party Session Portal</div>
        </div>
      </div>
      <div class="status-badge"><span class="pulse"></span> LIVE SESSION #88204</div>
    </div>

    <!-- Pinned Bar -->
    <div class="pinned-bar" id="pinnedBar">
      <i class="fa-solid fa-thumbtack"></i> <strong>PINNED:</strong> <span id="pinnedContent">None</span>
    </div>

    <!-- Escrow Officer Control Panel -->
    <div class="admin-tools" id="adminTools">
      <span class="admin-label"><i class="fa-solid fa-user-gear"></i> ESCROW CONTROLS:</span>
      <button class="admin-btn admin-btn-accent" onclick="renameParty('A')"><i class="fa-solid fa-pen"></i> Rename Buyer (A)</button>
      <button class="admin-btn admin-btn-accent" onclick="renameParty('B')"><i class="fa-solid fa-pen"></i> Rename Seller (B)</button>
      <button class="admin-btn admin-btn-accent" onclick="toggleFileLock()" id="lockFileBtn"><i class="fa-solid fa-lock"></i> Lock Files</button>
      <button class="admin-btn" onclick="kickUser('A')"><i class="fa-solid fa-user-xmark"></i> Kick Party A</button>
      <button class="admin-btn" onclick="kickUser('B')"><i class="fa-solid fa-user-xmark"></i> Kick Party B</button>
    </div>

    <!-- Messages Window -->
    <div class="chat-messages" id="messageContainer"></div>

    <!-- Control Bar -->
    <div class="footer-controls">
      <select class="role-dropdown" id="roleSelect" onchange="joinSession()">
        <option value="PARTY A">Role: Party A (Buyer)</option>
        <option value="PARTY B">Role: Party B (Seller)</option>
      </select>
      
      <button class="admin-login-btn" id="adminAuthBtn" onclick="loginAsAdmin()">
        <i class="fa-solid fa-key"></i> Escrow Login
      </button>

      <label class="file-btn-label" for="fileInput"><i class="fa-solid fa-paperclip"></i> File</label>
      <input type="file" id="fileInput" class="file-input" onchange="sendFile(this)" />

      <input type="text" class="message-input" id="messageInput" placeholder="Write a secure message..." onkeydown="if(event.key==='Enter') sendMsg()" oninput="pingActivity()" />
      <button class="send-btn" onclick="sendMsg()"><i class="fa-solid fa-paper-plane"></i> SEND</button>
    </div>
  </div>

  <script>
    const socket = io();
    const roomId = "88204-SESSION";
    let currentCustomNames = {};
    let isAdminConfirmed = false;

    function pingActivity() {
      if (isAdminConfirmed) socket.emit('ping-activity');
    }

    document.addEventListener('click', pingActivity);

    function joinSession(adminKey = null) {
      const selectedRole = adminKey ? 'ADMINISTRATOR' : document.getElementById('roleSelect').value;
      socket.emit('join-room', { roomId, role: selectedRole, adminKey });
    }

    function loginAsAdmin() {
      const password = prompt("Enter Escrow Officer Passkey:");
      if (password) joinSession(password);
    }

    function sendMsg() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text) return;

      socket.emit('send-message', { roomId, text });
      input.value = '';
    }

    function sendFile(input) {
      const file = input.files[0];
      if (!file) return;

      if (file.size > 10 * 1024 * 1024) {
        alert("File size exceeds 10MB limit.");
        return;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        socket.emit('send-message', {
          roomId,
          text: `Shared Document: ${file.name}`,
          fileData: e.target.result,
          fileName: file.name
        });
        input.value = '';
      };
      reader.readAsDataURL(file);
    }

    function renameParty(party) {
      const current = party === 'A' ? currentCustomNames['PARTY A'] : currentCustomNames['PARTY B'];
      const newName = prompt(`Enter custom display name for Party ${party}:`, current);
      if (newName && newName.trim()) {
        socket.emit('rename-party', { roomId, targetParty: party, newName: newName.trim() });
      }
    }

    function editMessage(msgId, currentText) {
      const newText = prompt("Edit message content:", currentText);
      if (newText !== null && newText.trim()) {
        socket.emit('edit-message', { roomId, msgId, newText: newText.trim() });
      }
    }

    function deleteMessage(msgId) {
      if (confirm("Permanently delete message for all participants?")) {
        socket.emit('delete-message', { roomId, msgId });
      }
    }

    function pinMessage(msgId) {
      socket.emit('pin-message', { roomId, msgId });
    }

    function kickUser(party) {
      const name = party === 'A' ? currentCustomNames['PARTY A'] : currentCustomNames['PARTY B'];
      if (confirm(`Remove ${name} from session?`)) {
        socket.emit('kick-participant', { roomId, targetParty: party });
      }
    }

    function toggleFileLock() {
      socket.emit('toggle-file-lock', { roomId });
    }

    function sanitizeText(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Server Callbacks
    socket.on('init-state', (state) => {
      document.getElementById('messageContainer').innerHTML = '';
      currentCustomNames = state.customNames;
      isAdminConfirmed = state.isAdminConfirmed;

      document.getElementById('adminTools').style.display = isAdminConfirmed ? 'flex' : 'none';
      document.getElementById('roleSelect').style.display = isAdminConfirmed ? 'none' : 'flex';
      document.getElementById('adminAuthBtn').style.display = isAdminConfirmed ? 'none' : 'flex';

      state.history.forEach(renderMessage);
      if (state.pinnedMessage) updatePinnedBar(state.pinnedMessage);
      updateFileLockUI(state.fileUploadsLocked);
    });

    socket.on('message', (msg) => {
      renderMessage(msg);
    });

    socket.on('names-updated', ({ customNames, history }) => {
      currentCustomNames = customNames;
      document.getElementById('messageContainer').innerHTML = '';
      history.forEach(renderMessage);
    });

    socket.on('message-edited', ({ msgId, newText }) => {
      const textElem = document.getElementById(`msg-text-${msgId}`);
      if (textElem) textElem.innerHTML = sanitizeText(newText);
    });

    socket.on('message-deleted', ({ msgId }) => {
      const msgElem = document.getElementById(`msg-box-${msgId}`);
      if (msgElem) msgElem.remove();
    });

    socket.on('update-pinned', (pinnedMsg) => {
      updatePinnedBar(pinnedMsg);
    });

    socket.on('file-lock-updated', (isLocked) => {
      updateFileLockUI(isLocked);
    });

    socket.on('admin-session-expired', (msg) => {
      alert(msg);
    });

    socket.on('auth-failed', (msg) => {
      alert(msg);
    });

    socket.on('kicked', (reason) => {
      alert(reason);
      window.location.reload();
    });

    socket.on('error-msg', (msg) => {
      alert(msg);
    });

    function updatePinnedBar(msg) {
      const bar = document.getElementById('pinnedBar');
      const content = document.getElementById('pinnedContent');
      bar.style.display = 'flex';
      content.textContent = `${msg.sender}: ${msg.text}`;
    }

    function updateFileLockUI(isLocked) {
      const btn = document.getElementById('lockFileBtn');
      if (btn) btn.innerHTML = isLocked ? '<i class="fa-solid fa-lock-open"></i> Unlock Files' : '<i class="fa-solid fa-lock"></i> Lock Files';
    }

    function renderMessage(data) {
      const container = document.getElementById('messageContainer');
      const msgDiv = document.createElement('div');
      msgDiv.id = `msg-box-${data.id}`;
      const safeText = sanitizeText(data.text);

      if (data.sender === 'SYSTEM') {
        msgDiv.className = 'message msg-system';
        msgDiv.innerHTML = `<i class="fa-solid fa-shield"></i> <strong>SYSTEM:</strong> ${safeText}`;
      } else {
        const isMsgFromAdmin = data.senderRole === 'ADMINISTRATOR' || data.sender === 'ESCROW OFFICER';
        msgDiv.className = `message ${isMsgFromAdmin ? 'msg-admin' : 'msg-party'}`;
        
        let fileHTML = '';
        if (data.fileData) {
          fileHTML = `
            <div class="file-card">
              <span><i class="fa-solid fa-file-arrow-down"></i> ${sanitizeText(data.fileName)}</span>
              <a href="${data.fileData}" download="${data.fileName}">Download</a>
            </div>`;
        }

        let adminActionsHTML = '';
        if (isAdminConfirmed) {
          adminActionsHTML = `
            <div class="msg-action-bar">
              <button class="action-icon-btn" onclick="editMessage('${data.id}', \`${safeText}\`)"><i class="fa-solid fa-pen"></i></button>
              <button class="action-icon-btn" onclick="pinMessage('${data.id}')"><i class="fa-solid fa-thumbtack"></i></button>
              <button class="action-icon-btn" onclick="deleteMessage('${data.id}')" style="color: var(--accent-rose);"><i class="fa-solid fa-trash"></i></button>
            </div>
          `;
        }

        msgDiv.innerHTML = `
          ${adminActionsHTML}
          <div class="sender-tag" style="color: ${isMsgFromAdmin ? 'var(--accent-cyan)' : 'var(--accent-amber)'};">
            <i class="fa-solid ${isMsgFromAdmin ? 'fa-user-shield' : 'fa-user'}"></i> ${sanitizeText(data.sender)}
          </div>
          <span id="msg-text-${data.id}">${safeText}</span>
          ${fileHTML}
          <div class="time-tag">${data.time}</div>
        `;
      }

      container.appendChild(msgDiv);
      container.scrollTop = container.scrollHeight;
    }

    joinSession();
  </script>
</body>
</html>
