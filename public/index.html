<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quantum Secure Transaction Desk</title>
  <script src="/socket.io/socket.io.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #020617;
      --panel-bg: rgba(15, 23, 42, 0.9);
      --side-panel-bg: #090d16;
      --accent-cyan: #38bdf8;
      --accent-emerald: #10b981;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
      --accent-indigo: #6366f1;
      --border: rgba(56, 189, 248, 0.2);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }

    body {
      background: var(--bg-dark);
      background-image: 
        radial-gradient(at 10% 10%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
        radial-gradient(at 90% 90%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
        radial-gradient(at 50% 50%, #020617 0px, #000 100%);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .app-wrapper {
      width: 100%;
      max-width: 1280px;
      height: 880px;
      display: flex;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(20px);
      overflow: hidden;
      position: relative;
    }

    /* Left Admin Panel */
    .admin-side-panel {
      width: 320px;
      background: var(--side-panel-bg);
      border-right: 1px solid var(--border);
      display: none;
      flex-direction: column;
      padding: 20px;
      gap: 16px;
      overflow-y: auto;
    }

    .admin-panel-title {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--accent-amber);
      letter-spacing: 1px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .admin-section {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .admin-btn {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      color: var(--accent-cyan);
      padding: 10px 14px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.82rem;
      outline: none;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
    }

    .admin-btn:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--accent-cyan);
    }

    .admin-btn-danger {
      color: var(--accent-rose);
      border-color: rgba(244, 63, 94, 0.3);
    }

    .admin-btn-danger:hover {
      background: rgba(244, 63, 94, 0.15);
      border-color: var(--accent-rose);
    }

    .admin-notes-area {
      width: 100%;
      height: 90px;
      background: #020617;
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      resize: none;
      outline: none;
    }

    .live-spectator-box {
      font-size: 0.78rem;
      color: var(--accent-cyan);
      background: rgba(56, 189, 248, 0.05);
      border: 1px dashed rgba(56, 189, 248, 0.3);
      padding: 8px 12px;
      border-radius: 8px;
      min-height: 45px;
    }

    /* Main Chat Container */
    .room-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .header {
      padding: 18px 28px;
      background: rgba(2, 6, 23, 0.95);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-group { display: flex; align-items: center; gap: 14px; }

    .vault-icon {
      width: 42px;
      height: 42px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--accent-cyan);
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .vault-icon:hover { box-shadow: 0 0 15px rgba(56, 189, 248, 0.4); }

    .brand-title {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #fff 30%, var(--accent-cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle { font-size: 0.75rem; color: var(--accent-amber); font-weight: 700; }

    .presence-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.75rem;
    }

    .presence-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      font-weight: 600;
    }

    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); }
    .status-dot.online { background: var(--accent-emerald); box-shadow: 0 0 8px var(--accent-emerald); }
    .status-dot.offline { background: var(--accent-rose); }

    .chat-messages {
      flex: 1;
      padding: 28px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 78%;
      padding: 14px 18px;
      border-radius: 16px;
      font-size: 0.92rem;
      line-height: 1.5;
      position: relative;
    }

    .msg-system {
      align-self: center;
      background: rgba(56, 189, 248, 0.05);
      border: 1px solid rgba(56, 189, 248, 0.15);
      color: var(--text-muted);
      font-size: 0.78rem;
      text-align: center;
      border-radius: 30px;
      padding: 8px 20px;
    }

    .msg-admin {
      align-self: flex-start;
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-top-left-radius: 4px;
    }

    .msg-party {
      align-self: flex-end;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-top-right-radius: 4px;
    }

    .sender-tag {
      font-size: 0.72rem;
      font-weight: 800;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .typing-indicator-box {
      height: 20px;
      padding: 0 28px;
      font-size: 0.75rem;
      color: var(--accent-cyan);
      font-style: italic;
    }

    .footer-controls {
      padding: 18px 28px;
      background: rgba(2, 6, 23, 0.95);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .role-dropdown, .lang-dropdown, .group-dropdown, .icon-btn {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      color: var(--accent-cyan);
      padding: 10px 14px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.82rem;
      outline: none;
      cursor: pointer;
    }

    .icon-btn.recording {
      background: var(--accent-rose);
      color: #fff;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse { from { opacity: 0.6; } to { opacity: 1; } }

    .message-input {
      flex: 1;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      color: #fff;
      padding: 12px 18px;
      border-radius: 12px;
      outline: none;
      font-size: 0.92rem;
    }

    .send-btn {
      background: linear-gradient(135deg, var(--accent-cyan) 0%, var(--accent-indigo) 100%);
      color: #020617;
      border: none;
      padding: 12px 22px;
      border-radius: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .file-input { display: none; }

    /* Direct Message Modal */
    .dm-modal {
      position: absolute;
      bottom: 80px;
      right: 28px;
      width: 360px;
      height: 420px;
      background: #0f172a;
      border: 1px solid var(--accent-cyan);
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      display: none;
      flex-direction: column;
      z-index: 1000;
      overflow: hidden;
    }

    .dm-header {
      padding: 12px 16px;
      background: rgba(56, 189, 248, 0.1);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--accent-cyan);
    }

    .dm-body { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; font-size: 0.82rem; }
    .dm-footer { padding: 10px; display: flex; gap: 6px; border-top: 1px solid var(--border); }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <!-- Left Admin Command Panel -->
    <div class="admin-side-panel" id="adminSidePanel">
      <div class="admin-panel-title">
        <i class="fa-solid fa-user-gear"></i> Admin Command Panel
      </div>

      <div class="admin-section">
        <span style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted);">ACTIVE ROOM MANAGEMENT</span>
        <select class="group-dropdown" id="adminGroupSelect" onchange="switchAdminGroup()"></select>
        <button class="admin-btn" onclick="createNewGroup()"><i class="fa-solid fa-plus"></i> New Group</button>
        <button class="admin-btn admin-btn-danger" onclick="deleteCurrentGroup()"><i class="fa-solid fa-trash"></i> Delete Active Group</button>
        <button class="admin-btn" onclick="copyInviteLink()"><i class="fa-solid fa-link"></i> Clean Invite Link</button>
      </div>

      <div class="admin-section">
        <span style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted);">PARTY RENAMING</span>
        <button class="admin-btn" onclick="renameParty('A')"><i class="fa-solid fa-pen"></i> Rename Buyer (A)</button>
        <button class="admin-btn" onclick="renameParty('B')"><i class="fa-solid fa-pen"></i> Rename Seller (B)</button>
        <button class="admin-btn" onclick="toggleFileLock()" id="lockFileBtn"><i class="fa-solid fa-lock"></i> Lock File Transfer</button>
      </div>

      <!-- Live Spectator Box -->
      <div class="admin-section">
        <span style="font-size: 0.75rem; font-weight: 700; color: var(--accent-amber);"><i class="fa-solid fa-eye"></i> LIVE SPECTATOR DRAFT</span>
        <div class="live-spectator-box" id="spectatorBox">No active typing detected...</div>
      </div>

      <!-- Direct Message & Email Notification -->
      <div class="admin-section">
        <span style="font-size: 0.75rem; font-weight: 700; color: var(--accent-cyan);"><i class="fa-solid fa-comments"></i> DIRECT MESSAGE / EMAIL</span>
        <select class="group-dropdown" id="activeUsersSelect"></select>
        <button class="admin-btn" onclick="initiateAdminDM()"><i class="fa-solid fa-paper-plane"></i> Send Direct Message</button>
      </div>

      <!-- Private Officer Notes -->
      <div class="admin-section">
        <span style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted);"><i class="fa-solid fa-note-sticky"></i> PRIVATE OFFICER NOTES</span>
        <textarea class="admin-notes-area" id="adminPrivateNotes" placeholder="Write persistent internal notes here..." oninput="saveAdminNotes()"></textarea>
      </div>
    </div>

    <!-- Main Chat Workspace -->
    <div class="room-container">
      <div class="header">
        <div class="brand-group">
          <div class="vault-icon" onclick="loginAsAdmin()" title="Admin Login">
            <i class="fa-solid fa-layer-group"></i>
          </div>
          <div>
            <div class="brand-title">QUANTUM SECURE TRANSACTION DESK</div>
            <div class="brand-subtitle" id="currentGroupName">General Transaction Group #1</div>
          </div>
        </div>

        <div class="presence-bar">
          <div class="presence-badge">
            <div class="status-dot online" id="selfStatusDot"></div>
            <span id="selfStatusText">You: Online</span>
          </div>
          <div class="presence-badge" id="counterpartyPresence">
            <div class="status-dot offline" id="peerStatusDot"></div>
            <span id="peerStatusText">Counterparty: Offline</span>
          </div>
        </div>
      </div>

      <div class="chat-messages" id="messageContainer"></div>

      <div class="typing-indicator-box" id="typingIndicator"></div>

      <div class="footer-controls">
        <select class="role-dropdown" id="roleSelect" onchange="joinSession()">
          <option value="PARTY A">Role: Buyer (Party A)</option>
          <option value="PARTY B">Role: Seller (Party B)</option>
        </select>

        <select class="lang-dropdown" id="targetLangSelect">
          <option value="en">🇬🇧 English</option>
          <option value="es">🇲🇽 Spanish</option>
          <option value="zh">🇨🇳 Chinese</option>
          <option value="fr">🇫🇷 French</option>
        </select>

        <!-- SPEECH RECOGNITION (VOICE-TO-TEXT) BUTTON -->
        <button class="icon-btn" id="micBtn" onclick="toggleSpeechRecognition()" title="Voice to Text"><i class="fa-solid fa-microphone"></i></button>

        <label class="icon-btn" for="fileInput"><i class="fa-solid fa-paperclip"></i></label>
        <input type="file" id="fileInput" class="file-input" />

        <input type="text" class="message-input" id="messageInput" placeholder="Write or speak message..." onkeydown="if(event.key==='Enter') sendMsg()" oninput="handleTyping()" />
        <button class="send-btn" onclick="sendMsg()"><i class="fa-solid fa-paper-plane"></i> SEND</button>
      </div>
    </div>
  </div>

  <!-- DM Modal -->
  <div class="dm-modal" id="dmModal">
    <div class="dm-header">
      <span><i class="fa-solid fa-user-shield"></i> Direct Message</span>
      <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="closeDMModal()"></i>
    </div>
    <div class="dm-body" id="dmBody"></div>
    <div class="dm-footer">
      <input type="text" class="message-input" id="dmInput" placeholder="Reply..." />
      <button class="send-btn" onclick="sendDMReply()"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
  </div>

  <script>
    const socket = io();

    let sessionToken = sessionStorage.getItem('q_session_token');
    if (!sessionToken) {
      sessionToken = 'token-' + Math.random().toString(36).substring(2, 15);
      sessionStorage.setItem('q_session_token', sessionToken);
    }

    const urlParams = new URLSearchParams(window.location.search);
    let activeGroupId = urlParams.get('groupId') || "default-group";
    
    let isAdminConfirmed = false;
    let currentSocketId = null;
    let activeDMRoomId = null;
    let typingTimeout = null;
    let recognition = null;
    let isRecording = false;

    // --- 1. SPEECH RECOGNITION (VOICE TO TEXT) ---
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        const msgInput = document.getElementById('messageInput');
        msgInput.value += (msgInput.value ? ' ' : '') + transcript;
        handleTyping();
      };

      recognition.onend = () => {
        isRecording = false;
        document.getElementById('micBtn').classList.remove('recording');
      };
    }

    function toggleSpeechRecognition() {
      if (!recognition) {
        alert("Speech Recognition is not supported in this browser. Try Chrome or Edge.");
        return;
      }
      if (isRecording) {
        recognition.stop();
      } else {
        recognition.start();
        isRecording = true;
        document.getElementById('micBtn').classList.add('recording');
      }
    }

    // --- 2. ADMIN LOGIN AND ROOM ACTIONS ---
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'A') loginAsAdmin();
    });

    window.addEventListener('load', () => {
      if (window.location.hash === '#admin') loginAsAdmin();
      loadOfflineMessages(); // Load persistent cache
    });

    function loginAsAdmin() {
      const password = prompt("Enter Administrator Passkey:");
      if (password) joinSession(password);
    }

    function joinSession(adminKey = null) {
      const selectedRole = adminKey ? 'ADMINISTRATOR' : document.getElementById('roleSelect').value;
      socket.emit('join-room', { 
        groupId: activeGroupId, 
        role: selectedRole, 
        adminKey,
        sessionToken
      });
      if (adminKey) socket.emit('get-all-groups');
    }

    function createNewGroup() {
      const name = prompt("Enter new Group Name:");
      if (name && name.trim()) {
        socket.emit('create-group', { groupName: name.trim() });
      }
    }

    // Server informs client to instantly open the new group
    socket.on('group-created-and-switch', ({ newGroupId }) => {
      activeGroupId = newGroupId;
      joinSession(isAdminConfirmed ? "ADMIN123" : null);
    });

    function deleteCurrentGroup() {
      if (confirm(`Are you sure you want to delete ${document.getElementById('currentGroupName').textContent}?`)) {
        socket.emit('delete-group', { groupId: activeGroupId });
      }
    }

    function renameParty(party) {
      const newName = prompt(`Enter new name for Party ${party}:`);
      if (newName && newName.trim()) {
        socket.emit('rename-party', { groupId: activeGroupId, party, newName: newName.trim() });
      }
    }

    function toggleFileLock() {
      socket.emit('toggle-file-lock', { groupId: activeGroupId });
    }

    function switchAdminGroup() {
      activeGroupId = document.getElementById('adminGroupSelect').value;
      joinSession("ADMIN123");
    }

    function copyInviteLink() {
      const cleanLink = `${window.location.origin}/?groupId=${activeGroupId}`;
      navigator.clipboard.writeText(cleanLink);
      alert(`Clean Invite Link Copied:\n${cleanLink}`);
    }

    // --- 3. PERSISTENCE (LOCAL STORAGE) ---
    function saveOfflineMessages(msgData) {
      const key = `offline_msgs_${activeGroupId}`;
      let history = JSON.parse(localStorage.getItem(key) || '[]');
      history.push(msgData);
      localStorage.setItem(key, JSON.stringify(history));
    }

    function loadOfflineMessages() {
      const key = `offline_msgs_${activeGroupId}`;
      const history = JSON.parse(localStorage.getItem(key) || '[]');
      history.forEach(renderMessage);
    }

    function saveAdminNotes() {
      localStorage.setItem(`admin_notes_${activeGroupId}`, document.getElementById('adminPrivateNotes').value);
    }

    function loadAdminNotes() {
      document.getElementById('adminPrivateNotes').value = localStorage.getItem(`admin_notes_${activeGroupId}`) || '';
    }

    function handleTyping() {
      const currentDraft = document.getElementById('messageInput').value;
      socket.emit('typing-start', { isTyping: true, currentDraft });

      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => {
        socket.emit('typing-start', { isTyping: false, currentDraft: '' });
      }, 1500);
    }

    socket.on('user-typing', ({ sender, isTyping }) => {
      document.getElementById('typingIndicator').textContent = isTyping ? `${sender} is typing...` : '';
    });

    socket.on('admin-live-draft', ({ sender, draftText }) => {
      if (!isAdminConfirmed) return;
      document.getElementById('spectatorBox').textContent = draftText ? `${sender}: "${draftText}"` : 'No active typing detected...';
    });

    function initiateAdminDM() {
      const targetSocketId = document.getElementById('activeUsersSelect').value;
      if (!targetSocketId) return;

      const initialMessage = prompt("Enter Direct Message:");
      const userEmail = prompt("Optional Email notification to participant (leave blank to skip):");
      
      if (initialMessage && initialMessage.trim()) {
        socket.emit('admin-initiate-dm', { targetSocketId, initialMessage: initialMessage.trim(), userEmail });
      }
    }

    socket.on('dm-channel-opened', ({ dmRoomId }) => {
      activeDMRoomId = dmRoomId;
      document.getElementById('dmModal').style.display = 'flex';
    });

    socket.on('dm-message', (msg) => {
      activeDMRoomId = msg.dmRoomId;
      document.getElementById('dmModal').style.display = 'flex';
      const body = document.getElementById('dmBody');
      const div = document.createElement('div');
      div.innerHTML = `<strong>${msg.sender}:</strong> ${msg.text} <span style="font-size:0.65rem; color:#64748b;">${msg.time}</span>`;
      body.appendChild(div);
      body.scrollTop = body.scrollHeight;
    });

    function sendDMReply() {
      const input = document.getElementById('dmInput');
      const text = input.value.trim();
      if (text && activeDMRoomId) {
        socket.emit('send-dm-reply', { dmRoomId: activeDMRoomId, text });
        input.value = '';
      }
    }

    function closeDMModal() { document.getElementById('dmModal').style.display = 'none'; }

    socket.on('presence-update', (users) => {
      const peer = users.find(u => u.socketId !== currentSocketId && !u.isAdmin);
      const dot = document.getElementById('peerStatusDot');
      const text = document.getElementById('peerStatusText');

      if (peer) {
        dot.className = `status-dot ${peer.isOnline ? 'online' : 'offline'}`;
        text.textContent = `${peer.displayName}: ${peer.isOnline ? 'Online' : 'Offline'}`;
      } else {
        dot.className = 'status-dot offline';
        text.textContent = 'Counterparty: Offline';
      }
    });

    socket.on('init-state', ({ group, isAdminConfirmed: adminState, socketId }) => {
      document.getElementById('messageContainer').innerHTML = '';
      isAdminConfirmed = adminState;
      currentSocketId = socketId;
      activeGroupId = group.id;

      document.getElementById('currentGroupName').textContent = group.name;
      document.getElementById('adminSidePanel').style.display = isAdminConfirmed ? 'flex' : 'none';
      document.getElementById('roleSelect').style.display = isAdminConfirmed ? 'none' : 'inline-block';

      if (isAdminConfirmed) loadAdminNotes();
      group.messages.forEach(renderMessage);
    });

    socket.on('active-users-list', (users) => {
      const select = document.getElementById('activeUsersSelect');
      if (!select) return;
      select.innerHTML = '';
      users.filter(u => u.socketId !== currentSocketId).forEach(u => {
        const opt = document.createElement('option');
        opt.value = u.socketId;
        opt.textContent = `${u.displayName} (${u.role})`;
        select.appendChild(opt);
      });
    });

    socket.on('all-groups-list', (groupList) => {
      const select = document.getElementById('adminGroupSelect');
      if (!select) return;
      select.innerHTML = '';
      groupList.forEach(g => {
        const opt = document.createElement('option');
        opt.value = g.id;
        opt.textContent = g.name;
        if (g.id === activeGroupId) opt.selected = true;
        select.appendChild(opt);
      });
    });

    socket.on('force-room-switch', ({ newGroupId }) => {
      alert("The active group was deleted by the Admin. Redirecting...");
      activeGroupId = newGroupId;
      joinSession(isAdminConfirmed ? "ADMIN123" : null);
    });

    socket.on('error-msg', (msg) => { alert(msg); });

    function sendMsg() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text) return;

      socket.emit('send-message', { groupId: activeGroupId, text });
      input.value = '';
    }

    function renderMessage(data) {
      saveOfflineMessages(data); // Save each incoming/outgoing msg to local cache
      const container = document.getElementById('messageContainer');
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${data.sender === 'SYSTEM' ? 'msg-system' : (data.senderRole === 'ADMINISTRATOR' ? 'msg-admin' : 'msg-party')}`;
      msgDiv.innerHTML = `
        <div class="sender-tag">${data.sender}</div>
        <div>${data.text}</div>
        <div style="font-size:0.65rem; color:#64748b; text-align:right;">${data.time}</div>
      `;
      container.appendChild(msgDiv);
      container.scrollTop = container.scrollHeight;
    }

    socket.on('message', renderMessage);

    joinSession();
  </script>
</body>
</html>
