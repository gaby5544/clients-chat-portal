<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Administrative Desk</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg-dark: #030712;
      --card-bg: rgba(11, 22, 44, 0.85);
      --accent-blue: #1199fa;
      --accent-green: #00d26a;
      --border: rgba(17, 153, 250, 0.25);
      --text: #ffffff;
      --subtext: #88a2c0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background: var(--bg-dark);
      background-image: radial-gradient(circle at 50% 0%, #0b1a38 0%, #030712 80%);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .room-container {
      width: 100%;
      max-width: 850px;
      height: 650px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 30px rgba(17, 153, 250, 0.15);
      backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      padding: 20px 25px;
      background: rgba(6, 15, 30, 0.9);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title { font-size: 1.1rem; font-weight: 800; letter-spacing: 1px; }
    .brand-title span { color: var(--accent-blue); }

    .status-badge {
      background: rgba(0, 210, 106, 0.15);
      color: var(--accent-green);
      border: 1px solid rgba(0, 210, 106, 0.3);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .chat-messages {
      flex: 1;
      padding: 25px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 75%;
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.4;
      position: relative;
    }

    .msg-system {
      align-self: center;
      background: rgba(17, 153, 250, 0.1);
      border: 1px solid rgba(17, 153, 250, 0.2);
      color: var(--subtext);
      font-size: 0.85rem;
      text-align: center;
      width: 90%;
    }

    .msg-admin {
      align-self: flex-start;
      background: rgba(17, 153, 250, 0.2);
      border: 1px solid var(--accent-blue);
      color: #fff;
    }

    .msg-party {
      align-self: flex-end;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .sender-tag {
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--accent-blue);
      text-transform: uppercase;
    }

    .time-tag {
      font-size: 0.65rem;
      color: rgba(255,255,255,0.4);
      margin-top: 4px;
      text-align: right;
    }

    .footer-controls {
      padding: 20px;
      background: rgba(6, 15, 30, 0.9);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 12px;
    }

    .role-dropdown {
      background: #091428;
      border: 1px solid var(--border);
      color: var(--accent-blue);
      padding: 12px;
      border-radius: 10px;
      font-weight: 700;
      outline: none;
    }

    .message-input {
      flex: 1;
      background: #091428;
      border: 1px solid var(--border);
      color: #fff;
      padding: 12px 16px;
      border-radius: 10px;
      outline: none;
    }

    .send-btn {
      background: linear-gradient(135deg, #1199fa 0%, #0052d4 100%);
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="room-container">
    <div class="header">
      <div class="brand-title">ESCROW <span>ADMIN DESK</span></div>
      <div class="status-badge"><span style="color:#00d26a;">●</span> LIVE SESSION #88204</div>
    </div>

    <div class="chat-messages" id="messageContainer"></div>

    <div class="footer-controls">
      <select class="role-dropdown" id="roleSelect" onchange="joinSession()">
        <option value="ADMINISTRATOR">Role: Admin</option>
        <option value="PARTY A (Buyer)">Role: Party A</option>
        <option value="PARTY B (Seller)">Role: Party B</option>
      </select>
      <input type="text" class="message-input" id="messageInput" placeholder="Enter message to session..." onkeydown="if(event.key==='Enter') sendMsg()" />
      <button class="send-btn" onclick="sendMsg()">SEND</button>
    </div>
  </div>

  <script>
    const socket = io();
    const roomId = "88204-ONCHAIN-DESK";

    function joinSession() {
      const role = document.getElementById('roleSelect').value;
      socket.emit('join-room', { roomId, role });
    }

    function sendMsg() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text) return;

      socket.emit('send-message', { roomId, text });
      input.value = '';
    }

    function sanitizeText(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    socket.on('message', (data) => {
      const container = document.getElementById('messageContainer');
      const msgDiv = document.createElement('div');
      const safeText = sanitizeText(data.text);

      if (data.sender === 'SYSTEM') {
        msgDiv.className = 'message msg-system';
        msgDiv.innerHTML = `<strong>SYSTEM:</strong> ${safeText}`;
      } else if (data.sender.includes('ADMIN')) {
        msgDiv.className = 'message msg-admin';
        msgDiv.innerHTML = `<div class="sender-tag">${sanitizeText(data.sender)}</div>${safeText}<div class="time-tag">${data.time}</div>`;
      } else {
        msgDiv.className = 'message msg-party';
        msgDiv.innerHTML = `<div class="sender-tag" style="color:#a3b8cc;">${sanitizeText(data.sender)}</div>${safeText}<div class="time-tag">${data.time}</div>`;
      }

      container.appendChild(msgDiv);
      container.scrollTop = container.scrollHeight;
    });

    // Initial Join
    joinSession();
  </script>
</body>
</html>
