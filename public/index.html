<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultra Secure Session Portal</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg-dark: #030712;
      --card-bg: rgba(11, 20, 38, 0.88);
      --accent-gold: #f59e0b;
      --accent-cyan: #06b6d4;
      --accent-blue: #3b82f6;
      --accent-red: #ef4444;
      --border: rgba(6, 182, 212, 0.25);
      --text: #f8fafc;
      --subtext: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(6, 182, 212, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.12) 0px, transparent 50%),
        radial-gradient(at 50% 50%, #030712 0px, #02040a 100%);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .room-container {
      width: 100%;
      max-width: 950px;
      height: 750px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9), 0 0 30px rgba(6, 182, 212, 0.1);
      backdrop-filter: blur(25px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      padding: 18px 25px;
      background: rgba(5, 11, 24, 0.95);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      fill: var(--accent-cyan);
      filter: drop-shadow(0 0 6px var(--accent-cyan));
    }

    .brand-title { 
      font-size: 1.05rem; 
      font-weight: 800; 
      letter-spacing: 2px; 
      text-transform: uppercase; 
    }
    .brand-title span { color: var(--accent-cyan); }

    .status-badge {
      font-size: 0.8rem;
      font-weight: 700;
      color: #10b981;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 4px 12px;
      border-radius: 20px;
    }

    .pulse {
      width: 8px;
      height: 8px;
      background-color: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
    }

    .pinned-bar {
      background: rgba(245, 158, 11, 0.08);
      border-bottom: 1px solid rgba(245, 158, 11, 0.25);
      padding: 10px 24px;
      font-size: 0.85rem;
      color: var(--accent-gold);
      display: none;
      align-items: center;
      gap: 10px;
    }

    .admin-tools {
      background: rgba(2, 6, 18, 0.8);
      padding: 10px 24px;
      border-bottom: 1px solid var(--border);
      display: none;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .admin-label {
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--accent-gold);
      margin-right: 6px;
    }

    .admin-btn {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.75rem;
      transition: all 0.2s;
    }

    .admin-btn:hover {
      background: rgba(239, 68, 68, 0.25);
    }

    .admin-btn-accent {
      background: rgba(6, 182, 212, 0.12);
      border: 1px solid rgba(6, 182, 212, 0.35);
      color: var(--accent-cyan);
    }

    .chat-messages {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 78%;
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 0.92rem;
      line-height: 1.45;
      position: relative;
    }

    .msg-system {
      align-self: center;
      background: rgba(6, 182, 212, 0.08);
      border: 1px solid rgba(6, 182, 212, 0.18);
      color: var(--subtext);
      font-size: 0.8rem;
      text-align: center;
      width: 88%;
      border-radius: 20px;
    }

    .msg-admin {
      align-self: flex-start;
      background: rgba(6, 182, 212, 0.12);
      border: 1px solid var(--accent-cyan);
      font-family: 'Georgia', serif;
    }

    .msg-party {
      align-self: flex-end;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .sender-tag {
      font-size: 0.72rem;
      font-weight: 800;
      margin-bottom: 6px;
      color: var(--accent-cyan);
      text-transform: uppercase;
      font-family: sans-serif;
    }

    .time-tag {
      font-size: 0.65rem;
      color: rgba(255,255,255,0.4);
      margin-top: 6px;
      text-align: right;
      font-family: sans-serif;
    }

    .msg-action-bar {
      position: absolute;
      top: 6px;
      right: 10px;
      display: flex;
      gap: 6px;
    }

    .action-icon-btn {
      background: none;
      border: none;
      color: var(--subtext);
      cursor: pointer;
      font-size: 0.75rem;
      opacity: 0.7;
      transition: opacity 0.2s;
    }

    .action-icon-btn:hover { opacity: 1; }

    .footer-controls {
      padding: 18px 24px;
      background: rgba(5, 11, 24, 0.95);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .role-dropdown, .file-btn-label {
      background: #091326;
      border: 1px solid var(--border);
      color: var(--accent-cyan);
      padding: 12px 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
    }

    .message-input {
      flex: 1;
      background: #091326;
      border: 1px solid var(--border);
      color: #fff;
      padding: 12px 16px;
      border-radius: 10px;
      outline: none;
      font-size: 0.95rem;
    }

    .send-btn {
      background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
      color: #030712;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: 800;
      cursor: pointer;
      letter-spacing: 0.5px;
    }

    .file-input { display: none; }
  </style>
</head>
<body>

  <div class="room-container">
    <div class="header">
      <div class="brand-group">
        <svg class="logo-icon" viewBox="0 0 24 24">
          <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-5.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8s0 0 0 0z"/>
        </svg>
        <div class="brand-title">SECURE <span>SESSION DESK</span></div>
      </div>
      <div class="status-badge"><span class="pulse"></span> LIVE SESSION #88204</div>
    </div>

    <div class="pinned-bar" id="pinnedBar">
      📌 <strong>PINNED:</strong> <span id="pinnedContent">None</span>
    </div>

    <!-- Strictly Admin Tools -->
    <div class="admin-tools" id="adminTools">
      <span class="admin-label">ADMIN PANEL:</span>
      <button class="admin-btn admin-btn-accent" onclick="renameParty('A')">Rename Party A</button>
      <button class="admin-btn admin-btn-accent" onclick="renameParty('B')">Rename Party B</button>
      <button class="admin-btn admin-btn-accent" onclick="toggleFileLock()" id="lockFileBtn">Lock Uploads</button>
      <button class="admin-btn" onclick="kickUser('PARTY A (Buyer)')">Kick Party A</button>
      <button class="admin-btn" onclick="kickUser('PARTY B (Seller)')">Kick Party B</button>
    </div>

    <div class="chat-messages" id="messageContainer"></div>

    <div class="footer-controls">
      <select class="role-dropdown" id="roleSelect" onchange="joinSession()">
        <option value="ADMINISTRATOR">Role: Admin</option>
        <option value="PARTY A (Buyer)">Role: Party A</option>
        <option value="PARTY B (Seller)">Role: Party B</option>
      </select>
      
      <label class="file-btn-label" for="fileInput">📎 File</label>
      <input type="file" id="fileInput" class="file-input" onchange="sendFile(this)" />

      <input type="text" class="message-input" id="messageInput" placeholder="Enter message..." onkeydown="if(event.key==='Enter') sendMsg()" />
      <button class="send-btn" onclick="sendMsg()">SEND</button>
    </div>
  </div>

  <script>
    const socket = io();
    const roomId = "88204-SESSION";
    let currentCustomNames = { 'PARTY A': 'Party A', 'PARTY B': 'Party B' };

    function joinSession() {
      const role = document.getElementById('roleSelect').value;
      const isAdmin = role.includes('ADMIN');
      
      // Control panel visible ONLY to Admin
      document.getElementById('adminTools').style.display = isAdmin ? 'flex' : 'none';

      socket.emit('join-room', { roomId, role });
    }

    function sendMsg() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text) return;

      socket.emit('send-message', { roomId, text });
      input.value = '';
    }

    function sendFile(input) {
      const file = input.files[0];
      if (!file) return;

      if (file.size > 10 * 1024 * 1024) {
        alert("File size exceeds 10MB limit.");
        return;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        socket.emit('send-message', {
          roomId,
          text: `Attached File: ${file.name}`,
          fileData: e.target.result,
          fileName: file.name
        });
        input.value = '';
      };
      reader.readAsDataURL(file);
    }

    // Admin Functions
    function renameParty(party) {
      const newName = prompt(`Enter custom display name for Party ${party}:`);
      if (newName && newName.trim()) {
        socket.emit('rename-party', { roomId, targetParty: party, newName: newName.trim() });
      }
    }

    function editMessage(msgId, currentText) {
      const newText = prompt("Edit message content (updates silently for everyone):", currentText);
      if (newText !== null && newText.trim()) {
        socket.emit('edit-message', { roomId, msgId, newText: newText.trim() });
      }
    }

    function deleteMessage(msgId) {
      if (confirm("Delete this message remotely for all users?")) {
        socket.emit('delete-message', { roomId, msgId });
      }
    }

    function pinMessage(msgId) {
      socket.emit('pin-message', { roomId, msgId });
    }

    function kickUser(role) {
      if (confirm(`Terminate session for ${role}?`)) {
        socket.emit('kick-participant', { roomId, targetRole: role });
      }
    }

    function toggleFileLock() {
      socket.emit('toggle-file-lock', { roomId });
    }

    function sanitizeText(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Socket Event Listeners
    socket.on('init-state', (state) => {
      document.getElementById('messageContainer').innerHTML = '';
      currentCustomNames = state.customNames;
      state.history.forEach(renderMessage);
      if (state.pinnedMessage) updatePinnedBar(state.pinnedMessage);
      updateFileLockUI(state.fileUploadsLocked);
    });

    socket.on('message', (msg) => {
      renderMessage(msg);
    });

    socket.on('message-edited', ({ msgId, newText }) => {
      const textElem = document.getElementById(`msg-text-${msgId}`);
      if (textElem) textElem.innerHTML = sanitizeText(newText);
    });

    socket.on('message-deleted', ({ msgId }) => {
      const msgElem = document.getElementById(`msg-box-${msgId}`);
      if (msgElem) msgElem.remove();
    });

    socket.on('names-updated', (names) => {
      currentCustomNames = names;
    });

    socket.on('update-pinned', (pinnedMsg) => {
      updatePinnedBar(pinnedMsg);
    });

    socket.on('file-lock-updated', (isLocked) => {
      updateFileLockUI(isLocked);
    });

    socket.on('kicked', (reason) => {
      alert(reason);
      window.location.reload();
    });

    socket.on('error-msg', (msg) => {
      alert(msg);
    });

    function updatePinnedBar(msg) {
      const bar = document.getElementById('pinnedBar');
      const content = document.getElementById('pinnedContent');
      bar.style.display = 'flex';
      content.textContent = `${msg.sender}: ${msg.text}`;
    }

    function updateFileLockUI(isLocked) {
      const btn = document.getElementById('lockFileBtn');
      if (btn) btn.textContent = isLocked ? "Unlock Uploads" : "Lock Uploads";
    }

    function renderMessage(data) {
      const container = document.getElementById('messageContainer');
      const msgDiv = document.createElement('div');
      msgDiv.id = `msg-box-${data.id}`;
      const safeText = sanitizeText(data.text);
      const currentRole = document.getElementById('roleSelect').value;
      const isAdminUser = currentRole.includes('ADMIN');

      if (data.sender === 'SYSTEM') {
        msgDiv.className = 'message msg-system';
        msgDiv.innerHTML = `<strong>SYSTEM:</strong> ${safeText}`;
      } else {
        const isMsgFromAdmin = data.sender.includes('ADMIN');
        msgDiv.className = `message ${isMsgFromAdmin ? 'msg-admin' : 'msg-party'}`;
        
        let fileHTML = '';
        if (data.fileData) {
          fileHTML = `<br><a href="${data.fileData}" download="${data.fileName}" style="color: var(--accent-cyan); font-weight: bold;">📥 Download ${sanitizeText(data.fileName)}</a>`;
        }

        let adminActionsHTML = '';
        if (isAdminUser) {
          adminActionsHTML = `
            <div class="msg-action-bar">
              <button class="action-icon-btn" onclick="editMessage('${data.id}', \`${safeText}\`)">✏️</button>
              <button class="action-icon-btn" onclick="pinMessage('${data.id}')">📌</button>
              <button class="action-icon-btn" onclick="deleteMessage('${data.id}')" style="color: var(--accent-red);">🗑️</button>
            </div>
          `;
        }

        msgDiv.innerHTML = `
          ${adminActionsHTML}
          <div class="sender-tag" style="color: ${isMsgFromAdmin ? 'var(--accent-cyan)' : '#a3b8cc'};">${sanitizeText(data.sender)}</div>
          <span id="msg-text-${data.id}">${safeText}</span>
          ${fileHTML}
          <div class="time-tag">${data.time}</div>
        `;
      }

      container.appendChild(msgDiv);
      container.scrollTop = container.scrollHeight;
    }

    joinSession();
  </script>
</body>
</html>
