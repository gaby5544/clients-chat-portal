<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quantum Secure Transaction Desk</title>
  <script src="/socket.io/socket.io.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #0e1621;
      --panel-bg: #17212b;
      --side-panel-bg: #0e1621;
      --hover-bg: #202b36;
      --accent-cyan: #38bdf8;
      --accent-emerald: #10b981;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
      --accent-indigo: #6366f1;
      --border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #7f91a4;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; user-select: none; }

    body {
      background: #070a0d;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }

    .app-wrapper {
      width: 100%;
      max-width: 1350px;
      height: 900px;
      display: flex;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
      overflow: hidden;
      position: relative;
    }

    /* Telegram Style Side Navigation Panel */
    .telegram-sidebar {
      width: 360px;
      background: var(--side-panel-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    .tele-search-header {
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
    }

    .tele-search-input {
      flex: 1;
      background: #17212b;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 8px 16px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
    }

    .tele-chat-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .tele-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      gap: 12px;
      cursor: pointer;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      transition: background 0.15s ease;
    }

    .tele-item:hover, .tele-item.active {
      background: var(--hover-bg);
    }

    .tele-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #38bdf8);
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: 700;
      color: #fff;
      font-size: 1.1rem;
      position: relative;
      flex-shrink: 0;
    }

    .tele-avatar.user-avatar {
      background: linear-gradient(135deg, #10b981, #059669);
    }

    .tele-info {
      flex: 1;
      overflow: hidden;
    }

    .tele-top-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .tele-name {
      font-size: 0.9rem;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .tele-time {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .tele-sub-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .tele-last-msg {
      font-size: 0.8rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
    }

    .tele-badge {
      background: var(--accent-cyan);
      color: #0e1621;
      font-size: 0.7rem;
      font-weight: 800;
      border-radius: 10px;
      padding: 2px 7px;
    }

    /* Admin Overlay Controls inside Sidebar */
    .admin-controls-drawer {
      background: #17212b;
      border-top: 1px solid var(--border);
      padding: 12px;
      display: none;
      flex-direction: column;
      gap: 8px;
      max-height: 280px;
      overflow-y: auto;
    }

    .admin-btn {
      background: #0e1621;
      border: 1px solid var(--border);
      color: var(--accent-cyan);
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .admin-btn:hover { background: rgba(56, 189, 248, 0.15); }
    .admin-btn-danger { color: var(--accent-rose); border-color: rgba(244, 63, 94, 0.3); }

    /* Main Workspace */
    .room-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      background: #0e1621;
    }

    .header {
      padding: 16px 24px;
      background: #17212b;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-group { display: flex; align-items: center; gap: 14px; }

    .vault-icon {
      width: 40px;
      height: 40px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--accent-cyan);
      cursor: pointer;
    }

    .brand-title { font-size: 1rem; font-weight: 800; color: #fff; letter-spacing: 1px; }
    .brand-subtitle { font-size: 0.75rem; color: var(--accent-amber); font-weight: 700; }

    .presence-bar { display: flex; align-items: center; gap: 12px; font-size: 0.75rem; }

    .presence-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      background: #0e1621;
      border: 1px solid var(--border);
      font-weight: 600;
    }

    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); }
    .status-dot.online { background: var(--accent-emerald); box-shadow: 0 0 8px var(--accent-emerald); }
    .status-dot.offline { background: var(--accent-rose); }

    /* Pinned Header Bar */
    .pinned-bar {
      background: #17212b;
      border-bottom: 1px solid var(--border);
      padding: 8px 24px;
      font-size: 0.8rem;
      color: var(--accent-cyan);
      display: none;
      align-items: center;
      justify-content: space-between;
    }

    .chat-messages {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      position: relative;
    }

    .msg-wrapper.msg-party { justify-content: flex-end; }

    .message {
      max-width: 70%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.9rem;
      line-height: 1.4;
      position: relative;
      cursor: pointer;
      user-select: text;
    }

    .msg-system {
      align-self: center;
      background: rgba(56, 189, 248, 0.05);
      border: 1px solid rgba(56, 189, 248, 0.15);
      color: var(--text-muted);
      font-size: 0.78rem;
      border-radius: 20px;
      padding: 6px 16px;
    }

    .msg-admin {
      align-self: flex-start;
      background: #182533;
      border: 1px solid var(--border);
      border-top-left-radius: 2px;
    }

    .msg-party {
      align-self: flex-end;
      background: #2b5278;
      border-top-right-radius: 2px;
    }

    .sender-tag {
      font-size: 0.72rem;
      font-weight: 800;
      margin-bottom: 4px;
      text-transform: uppercase;
      color: var(--accent-cyan);
    }

    .msg-checkbox {
      display: none;
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .msg-wrapper.selection-mode .msg-checkbox {
      display: block;
    }

    /* Long-Press / Right-Click Context Menu */
    .context-menu {
      position: absolute;
      background: #17212b;
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: none;
      flex-direction: column;
      z-index: 2000;
      overflow: hidden;
      min-width: 140px;
    }

    .context-menu button {
      background: none;
      border: none;
      color: #fff;
      padding: 10px 14px;
      text-align: left;
      font-size: 0.82rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .context-menu button:hover {
      background: var(--hover-bg);
      color: var(--accent-cyan);
    }

    .bulk-delete-bar {
      display: none;
      background: rgba(244, 63, 94, 0.15);
      border-top: 1px solid var(--accent-rose);
      padding: 8px 24px;
      font-size: 0.8rem;
      color: var(--accent-rose);
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
    }

    .footer-controls {
      padding: 16px 24px;
      background: #17212b;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .role-dropdown, .lang-dropdown, .icon-btn {
      background: #0e1621;
      border: 1px solid var(--border);
      color: var(--accent-cyan);
      padding: 10px 12px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.82rem;
      outline: none;
      cursor: pointer;
    }

    .message-input {
      flex: 1;
      background: #0e1621;
      border: 1px solid var(--border);
      color: #fff;
      padding: 12px 16px;
      border-radius: 10px;
      outline: none;
      font-size: 0.9rem;
    }

    .send-btn {
      background: var(--accent-cyan);
      color: #0e1621;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .file-input { display: none; }

    /* Direct Message Modal */
    .dm-modal {
      position: absolute;
      bottom: 80px;
      right: 28px;
      width: 380px;
      height: 460px;
      background: #17212b;
      border: 1px solid var(--accent-cyan);
      border-radius: 16px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.9);
      display: none;
      flex-direction: column;
      z-index: 1000;
      overflow: hidden;
    }

    .dm-header {
      padding: 12px 16px;
      background: #0e1621;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--accent-cyan);
    }

    .dm-body { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .dm-footer { padding: 10px; display: flex; gap: 8px; border-top: 1px solid var(--border); background: #0e1621; }
  </style>
</head>
<body>

  <div class="app-wrapper" onclick="hideContextMenu()">
    
    <!-- Telegram Style Side Navigation Panel -->
    <div class="telegram-sidebar">
      <div class="tele-search-header">
        <i class="fa-solid fa-bars" style="color: var(--text-muted); cursor: pointer;" onclick="toggleAdminDrawer()"></i>
        <input type="text" class="tele-search-input" placeholder="Search groups or buyers..." oninput="filterChatList(this.value)" />
      </div>

      <div class="tele-chat-list" id="telegramChatList"></div>

      <!-- Admin Control Overlay Drawer -->
      <div class="admin-controls-drawer" id="adminDrawer">
        <span style="font-size: 0.75rem; font-weight: 800; color: var(--accent-amber);">ADMIN COMMAND CENTER</span>
        <button class="admin-btn" onclick="createNewGroup()"><i class="fa-solid fa-plus"></i> Create New Group</button>
        <button class="admin-btn admin-btn-danger" onclick="deleteCurrentGroup()"><i class="fa-solid fa-trash"></i> Delete Active Group</button>
        <button class="admin-btn" id="uploadPermBtn" onclick="toggleAdminUploads()"><i class="fa-solid fa-paperclip"></i> Uploads: Allowed</button>
        <button class="admin-btn" onclick="renameParty('A')"><i class="fa-solid fa-pen"></i> Rename Buyer (Party A)</button>
        <button class="admin-btn" onclick="renameParty('B')"><i class="fa-solid fa-pen"></i> Rename Seller (Party B)</button>
        <button class="admin-btn" onclick="copyInviteLink()"><i class="fa-solid fa-link"></i> Copy Clean Link</button>
      </div>
    </div>

    <!-- Main Workspace Desk -->
    <div class="room-container">
      <div class="header">
        <div class="brand-group">
          <div class="vault-icon" onclick="loginAsAdmin()" title="Admin Login">
            <i class="fa-solid fa-shield-halved"></i>
          </div>
          <div>
            <div class="brand-title">QUANTUM TRANSACTION DESK</div>
            <div class="brand-subtitle" id="currentGroupName">General Transaction Group #1</div>
          </div>
        </div>

        <div class="presence-bar">
          <div class="presence-badge">
            <div class="status-dot online" id="selfStatusDot"></div>
            <span id="selfStatusText">You: Online</span>
          </div>
          <div class="presence-badge" id="counterpartyPresence">
            <div class="status-dot offline" id="peerStatusDot"></div>
            <span id="peerStatusText">Counterparty: Offline</span>
          </div>
        </div>
      </div>

      <!-- Pinned Messages Bar -->
      <div class="pinned-bar" id="pinnedBar">
        <span id="pinnedText"><i class="fa-solid fa-thumbtack"></i> Pinned message preview...</span>
        <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="unpinCurrentMsg()"></i>
      </div>

      <div class="chat-messages" id="messageContainer"></div>

      <!-- Admin Bulk Delete Bar -->
      <div class="bulk-delete-bar" id="bulkDeleteBar">
        <span id="bulkDeleteCount">0 messages selected</span>
        <button class="admin-btn admin-btn-danger" style="padding: 4px 10px;" onclick="executeBulkDeleteMessages()">
          <i class="fa-solid fa-trash"></i> Delete Selected
        </button>
      </div>

      <div class="footer-controls">
        <select class="role-dropdown" id="roleSelect" onchange="joinSession()">
          <option value="PARTY A">Role: Buyer (Party A)</option>
          <option value="PARTY B">Role: Seller (Party B)</option>
        </select>

        <select class="lang-dropdown" id="targetLangSelect">
          <option value="en">🇬🇧 English</option>
          <option value="zh">🇨🇳 Chinese</option>
          <option value="es">🇪🇸 Spanish</option>
          <option value="ar">🇸🇦 Arabic</option>
          <option value="fr">🇫🇷 French</option>
          <option value="pt">🇵🇹 Portuguese</option>
          <option value="ru">🇷🇺 Russian</option>
        </select>

        <button class="icon-btn" id="micBtn" onclick="toggleSpeechRecognition()" title="Voice Input"><i class="fa-solid fa-microphone"></i></button>

        <label class="icon-btn" id="fileUploadLabel" for="fileInput"><i class="fa-solid fa-paperclip"></i></label>
        <input type="file" id="fileInput" class="file-input" />

        <input type="text" class="message-input" id="messageInput" placeholder="Write message..." onkeydown="if(event.key==='Enter') sendMsg()" />
        
        <button class="send-btn" onclick="sendMsg()">
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Context Action Menu (Long-Press / Right-Click) -->
  <div class="context-menu" id="contextMenu">
    <button onclick="contextAction('select')"><i class="fa-solid fa-check-square"></i> Select</button>
    <button id="ctxEditBtn" onclick="contextAction('edit')"><i class="fa-solid fa-pen"></i> Edit</button>
    <button id="ctxPinBtn" onclick="contextAction('pin')"><i class="fa-solid fa-thumbtack"></i> Pin / Unpin</button>
  </div>

  <!-- DM Modal -->
  <div class="dm-modal" id="dmModal">
    <div class="dm-header">
      <span><i class="fa-solid fa-user-shield"></i> Direct Message</span>
      <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="closeDMModal()"></i>
    </div>
    <div class="dm-body" id="dmBody"></div>
    <div class="dm-footer">
      <input type="text" class="message-input" id="dmInput" placeholder="Direct reply..." onkeydown="if(event.key==='Enter') sendDMReply()" />
      <button class="send-btn" onclick="sendDMReply()"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
  </div>

  <script>
    const socket = io();

    let sessionToken = sessionStorage.getItem('q_session_token');
    if (!sessionToken) {
      sessionToken = 'token-' + Math.random().toString(36).substring(2, 15);
      sessionStorage.setItem('q_session_token', sessionToken);
    }

    const urlParams = new URLSearchParams(window.location.search);
    let activeGroupId = urlParams.get('groupId') || "default-group";
    
    let isAdminConfirmed = false;
    let currentSocketId = null;
    let activeDMRoomId = null;
    let selectedMsgIds = new Set();
    let targetContextMsgId = null;
    let targetContextText = "";
    let longPressTimer = null;
    let allGroupsData = [];
    let activeUsersData = [];

    // --- REALTIME TRANSLATION ENGINE ---
    async function translateText(text, targetLang) {
      if (!text || targetLang === 'en' || !targetLang) return text;
      try {
        const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=autodetect|${targetLang}`);
        const data = await res.json();
        return data?.responseData?.translatedText || text;
      } catch (err) {
        return text;
      }
    }

    // --- ADMIN INITIALIZATION ---
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'A') loginAsAdmin();
    });

    window.addEventListener('load', () => {
      if (window.location.hash === '#admin') loginAsAdmin();
    });

    function loginAsAdmin() {
      const password = prompt("Enter Administrator Passkey:");
      if (password) joinSession(password);
    }

    function joinSession(adminKey = null) {
      const selectedRole = adminKey ? 'ADMINISTRATOR' : document.getElementById('roleSelect').value;
      socket.emit('join-room', { 
        groupId: activeGroupId, 
        role: selectedRole, 
        adminKey,
        sessionToken
      });
      socket.emit('get-all-groups');
    }

    function toggleAdminDrawer() {
      if (!isAdminConfirmed) return;
      const drawer = document.getElementById('adminDrawer');
      drawer.style.display = drawer.style.display === 'flex' ? 'none' : 'flex';
    }

    function toggleAdminUploads() {
      socket.emit('admin-toggle-upload-permission', { groupId: activeGroupId });
    }

    socket.on('upload-permission-changed', ({ fileUploadsEnabled }) => {
      const fileLabel = document.getElementById('fileUploadLabel');
      const btn = document.getElementById('uploadPermBtn');
      if (fileUploadsEnabled) {
        fileLabel.style.pointerEvents = 'auto';
        fileLabel.style.opacity = '1';
        if (btn) btn.textContent = "Uploads: Allowed";
      } else {
        fileLabel.style.pointerEvents = 'none';
        fileLabel.style.opacity = '0.3';
        if (btn) btn.textContent = "Uploads: Disabled";
      }
    });

    // --- CONTEXT MENU (LONG PRESS & RIGHT CLICK) ---
    function attachContextListeners(element, msgId, text) {
      // Desktop Right Click
      element.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        showContextMenu(e.clientX, e.clientY, msgId, text);
      });

      // Mobile Touch Long Press
      element.addEventListener('touchstart', (e) => {
        longPressTimer = setTimeout(() => {
          const touch = e.touches[0];
          showContextMenu(touch.clientX, touch.clientY, msgId, text);
        }, 500);
      });

      element.addEventListener('touchend', () => clearTimeout(longPressTimer));
      element.addEventListener('touchmove', () => clearTimeout(longPressTimer));
    }

    function showContextMenu(x, y, msgId, text) {
      targetContextMsgId = msgId;
      targetContextText = text;
      
      const menu = document.getElementById('contextMenu');
      document.getElementById('ctxEditBtn').style.display = isAdminConfirmed ? 'flex' : 'none';
      document.getElementById('ctxPinBtn').style.display = isAdminConfirmed ? 'flex' : 'none';

      menu.style.left = `${Math.min(x, window.innerWidth - 150)}px`;
      menu.style.top = `${Math.min(y, window.innerHeight - 120)}px`;
      menu.style.display = 'flex';
    }

    function hideContextMenu() {
      document.getElementById('contextMenu').style.display = 'none';
    }

    function contextAction(type) {
      hideContextMenu();
      if (type === 'select') {
        document.querySelectorAll('.msg-wrapper').forEach(el => el.classList.add('selection-mode'));
        const cb = document.getElementById(`chk-${targetContextMsgId}`);
        if (cb) { cb.checked = true; toggleMsgSelection(targetContextMsgId, cb); }
      } else if (type === 'edit' && isAdminConfirmed) {
        const newText = prompt("Admin: Edit Message Content:", targetContextText);
        if (newText !== null && newText.trim() !== "") {
          socket.emit('admin-edit-message', { groupId: activeGroupId, messageId: targetContextMsgId, newText: newText.trim() });
        }
      } else if (type === 'pin' && isAdminConfirmed) {
        socket.emit('admin-toggle-pin-message', { groupId: activeGroupId, messageId: targetContextMsgId });
      }
    }

    function toggleMsgSelection(msgId, cb) {
      if (cb.checked) { selectedMsgIds.add(msgId); } 
      else { selectedMsgIds.delete(msgId); }
      updateBulkDeleteBar();
    }

    function updateBulkDeleteBar() {
      const bar = document.getElementById('bulkDeleteBar');
      const countLabel = document.getElementById('bulkDeleteCount');
      if (selectedMsgIds.size > 0 && isAdminConfirmed) {
        bar.style.display = 'flex';
        countLabel.textContent = `${selectedMsgIds.size} message(s) selected`;
      } else {
        bar.style.display = 'none';
      }
    }

    function executeBulkDeleteMessages() {
      if (selectedMsgIds.size === 0) return;
      if (confirm(`Delete ${selectedMsgIds.size} message(s)?`)) {
        socket.emit('admin-bulk-delete-messages', { groupId: activeGroupId, messageIds: Array.from(selectedMsgIds) });
        selectedMsgIds.clear();
        updateBulkDeleteBar();
      }
    }

    // --- REALTIME SOCKET EVENTS ---
    socket.on('message-edited', ({ messageId, newText }) => {
      const textNode = document.getElementById(`msg-text-${messageId}`);
      if (textNode) textNode.textContent = newText; // Stealth edit: No (edited) tag!
    });

    socket.on('pinned-messages-updated', (pinnedList) => {
      const bar = document.getElementById('pinnedBar');
      const text = document.getElementById('pinnedText');
      if (pinnedList && pinnedList.length > 0) {
        const latestPin = pinnedList[pinnedList.length - 1];
        text.innerHTML = `<i class="fa-solid fa-thumbtack"></i> <b>Pinned:</b> ${latestPin.sender}: ${latestPin.text}`;
        bar.style.display = 'flex';
      } else {
        bar.style.display = 'none';
      }
    });

    socket.on('messages-bulk-deleted', ({ messageIds }) => {
      messageIds.forEach(id => {
        const element = document.getElementById(`msg-row-${id}`);
        if (element) element.remove();
      });
    });

    socket.on('init-state', ({ group, isAdminConfirmed: adminState, socketId }) => {
      document.getElementById('messageContainer').innerHTML = '';
      isAdminConfirmed = adminState;
      currentSocketId = socketId;
      activeGroupId = group.id;

      document.getElementById('currentGroupName').textContent = group.name;
      document.getElementById('roleSelect').style.display = isAdminConfirmed ? 'none' : 'inline-block';
      
      group.messages.forEach(renderMessage);
    });

    // --- TELEGRAM STYLE SIDEBAR RENDERER ---
    socket.on('all-groups-list', (groupList) => {
      allGroupsData = groupList;
      renderTelegramSidebar();
    });

    socket.on('active-users-list', (users) => {
      activeUsersData = users;
      renderTelegramSidebar();
    });

    function renderTelegramSidebar() {
      const container = document.getElementById('telegramChatList');
      if (!container) return;
      container.innerHTML = '';

      // 1. Render Group Chats
      allGroupsData.forEach(g => {
        const lastMsg = g.messages.length > 0 ? g.messages[g.messages.length - 1] : { text: 'No messages yet', time: '' };
        const isSelected = (g.id === activeGroupId);

        const item = document.createElement('div');
        item.className = `tele-item ${isSelected ? 'active' : ''}`;
        item.onclick = () => {
          activeGroupId = g.id;
          joinSession(isAdminConfirmed ? "ADMIN123" : null);
        };

        item.innerHTML = `
          <div class="tele-avatar">
            <i class="fa-solid fa-users"></i>
          </div>
          <div class="tele-info">
            <div class="tele-top-line">
              <span class="tele-name">${g.name} ${g.highlighted ? '<i class="fa-solid fa-star" style="color:#f59e0b"></i>' : ''}</span>
              <span class="tele-time">${lastMsg.time}</span>
            </div>
            <div class="tele-sub-line">
              <span class="tele-last-msg">${lastMsg.sender ? lastMsg.sender + ': ' : ''}${lastMsg.text}</span>
            </div>
          </div>
        `;
        container.appendChild(item);
      });

      // 2. Render Direct Message Users (If Admin)
      if (isAdminConfirmed) {
        activeUsersData.filter(u => u.socketId !== currentSocketId).forEach(u => {
          const item = document.createElement('div');
          item.className = 'tele-item';
          item.onclick = () => initiateAdminDMWithUser(u.socketId);

          item.innerHTML = `
            <div class="tele-avatar user-avatar">
              <i class="fa-solid fa-user"></i>
            </div>
            <div class="tele-info">
              <div class="tele-top-line">
                <span class="tele-name">${u.displayName} <i class="fa-solid fa-circle-check" style="color:#38bdf8; font-size:0.7rem;"></i></span>
                <span class="tele-time">DM</span>
              </div>
              <div class="tele-sub-line">
                <span class="tele-last-msg">${u.role}</span>
                <span class="tele-badge">Online</span>
              </div>
            </div>
          `;
          container.appendChild(item);
        });
      }
    }

    function filterChatList(query) {
      const q = query.toLowerCase();
      document.querySelectorAll('.tele-item').forEach(el => {
        const text = el.textContent.toLowerCase();
        el.style.display = text.includes(q) ? 'flex' : 'none';
      });
    }

    function initiateAdminDMWithUser(targetSocketId) {
      const initialMessage = prompt("Direct Message content:");
      if (initialMessage && initialMessage.trim()) {
        socket.emit('admin-initiate-dm', { targetSocketId, initialMessage: initialMessage.trim() });
      }
    }

    // --- MESSAGE RENDERER ---
    async function renderMessage(data) {
      if (!data.id) data.id = 'msg-' + Date.now();

      const container = document.getElementById('messageContainer');
      const msgWrapper = document.createElement('div');
      const isPartyClass = (data.senderRole === 'PARTY A' || data.senderRole === 'PARTY B') ? 'msg-party' : '';
      
      msgWrapper.className = `msg-wrapper ${isPartyClass}`;
      msgWrapper.id = `msg-row-${data.id}`;

      const isSystem = (data.sender === 'SYSTEM');
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${isSystem ? 'msg-system' : (data.senderRole === 'ADMINISTRATOR' ? 'msg-admin' : 'msg-party')}`;

      const selectedLang = document.getElementById('targetLangSelect').value;
      let translatedNotice = '';

      if (!isSystem && selectedLang !== 'en') {
        const translated = await translateText(data.text, selectedLang);
        if (translated !== data.text) {
          translatedNotice = `<div style="font-size:0.72rem; color:var(--accent-cyan); margin-top:4px;"><i class="fa-solid fa-language"></i> ${translated}</div>`;
        }
      }

      msgDiv.innerHTML = `
        ${!isSystem ? `<div class="sender-tag">${data.sender}</div>` : ''}
        <div id="msg-text-${data.id}">${data.text}</div>
        ${translatedNotice}
        <div style="font-size:0.65rem; color:var(--text-muted); text-align:right; margin-top:4px;">${data.time}</div>
      `;

      if (!isSystem) attachContextListeners(msgDiv, data.id, data.text);

      const chk = document.createElement('input');
      chk.type = 'checkbox';
      chk.className = 'msg-checkbox';
      chk.id = `chk-${data.id}`;
      chk.onchange = () => toggleMsgSelection(data.id, chk);

      msgWrapper.appendChild(chk);
      msgWrapper.appendChild(msgDiv);

      container.appendChild(msgWrapper);
      container.scrollTop = container.scrollHeight;
    }

    async function sendMsg() {
      const input = document.getElementById('messageInput');
      const rawText = input.value.trim();
      if (!rawText) return;

      const targetLang = document.getElementById('targetLangSelect').value;
      const outgoingText = await translateText(rawText, targetLang);

      socket.emit('send-message', { groupId: activeGroupId, text: outgoingText, targetLang });
      input.value = '';
    }

    function createNewGroup() {
      const name = prompt("Enter Group Name:");
      if (name && name.trim()) socket.emit('create-group', { groupName: name.trim() });
    }

    function deleteCurrentGroup() {
      if (confirm(`Delete active group?`)) socket.emit('delete-group', { groupId: activeGroupId });
    }

    function renameParty(party) {
      const newName = prompt(`Enter new name for Party ${party}:`);
      if (newName && newName.trim()) socket.emit('rename-party', { groupId: activeGroupId, party, newName: newName.trim() });
    }

    function copyInviteLink() {
      const cleanLink = `${window.location.origin}/?groupId=${activeGroupId}`;
      navigator.clipboard.writeText(cleanLink);
      alert(`Clean Link Copied:\n${cleanLink}`);
    }

    socket.on('message', renderMessage);
    joinSession();
  </script>
</body>
</html>
