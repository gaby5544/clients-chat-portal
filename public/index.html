<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quantum Secure Transaction Desk</title>
  <script src="/socket.io/socket.io.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #020617;
      --panel-bg: rgba(15, 23, 42, 0.92);
      --sidebar-bg: #0b1329;
      --accent-cyan: #38bdf8;
      --accent-emerald: #10b981;
      --accent-rose: #f43f5e;
      --accent-amber: #f59e0b;
      --border: rgba(56, 189, 248, 0.2);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }

    body {
      background: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Admin Left Sidebar */
    .admin-sidebar {
      width: 320px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: none; /* Hidden for regular users */
      flex-direction: column;
      z-index: 100;
    }

    .sidebar-header {
      padding: 20px;
      background: rgba(2, 6, 23, 0.8);
      border-bottom: 1px solid var(--border);
      font-weight: 800;
      color: var(--accent-amber);
      font-size: 0.85rem;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sidebar-section {
      padding: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      flex: 1;
      overflow-y: auto;
    }

    .sidebar-title {
      font-size: 0.72rem;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 10px;
      font-weight: 700;
    }

    .saved-notes-textarea {
      width: 100%;
      height: 140px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      resize: none;
      font-size: 0.82rem;
    }

    /* Main Chat Portal */
    .main-portal {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .header {
      padding: 18px 28px;
      background: rgba(2, 6, 23, 0.95);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
    }
    .status-online { background: var(--accent-emerald); box-shadow: 0 0 8px var(--accent-emerald); }
    .status-offline { background: var(--accent-rose); }

    .chat-messages {
      flex: 1;
      padding: 28px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 78%;
      padding: 14px 18px;
      border-radius: 16px;
      font-size: 0.92rem;
      position: relative;
    }

    .msg-admin { align-self: flex-start; background: rgba(56, 189, 248, 0.08); border: 1px solid rgba(56, 189, 248, 0.3); }
    .msg-party { align-self: flex-end; background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); }

    .typing-bar {
      padding: 6px 28px;
      font-size: 0.75rem;
      color: var(--accent-cyan);
      font-style: italic;
      min-height: 24px;
    }

    .footer-controls {
      padding: 18px 28px;
      background: rgba(2, 6, 23, 0.95);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .message-input {
      flex: 1;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      color: #fff;
      padding: 12px 18px;
      border-radius: 12px;
      outline: none;
    }

    .send-btn {
      background: linear-gradient(135deg, var(--accent-cyan), #6366f1);
      color: #020617;
      border: none;
      padding: 12px 22px;
      border-radius: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .admin-btn {
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid var(--border);
      color: var(--accent-cyan);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.78rem;
      margin-top: 6px;
      width: 100%;
      text-align: left;
    }
  </style>
</head>
<body>

  <!-- LEFT ADMIN SIDEBAR (Visible ONLY to Admin) -->
  <div class="admin-sidebar" id="adminSidebar">
    <div class="sidebar-header">
      <i class="fa-solid fa-user-shield"></i> ADMIN COMMAND CENTER
    </div>
    
    <div class="sidebar-section">
      <div class="sidebar-title">Group Invite Link Generator</div>
      <button class="admin-btn" onclick="generateCleanInviteLink()"><i class="fa-solid fa-link"></i> Copy Group Link</button>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-title">Admin Saved Messages / Notes</div>
      <textarea class="saved-notes-textarea" id="adminNotes" placeholder="Type private administrative notes here..." oninput="saveAdminNotes()"></textarea>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-title">Out-of-Group Direct Messaging</div>
      <div id="userListDM"></div>
    </div>
  </div>

  <!-- MAIN CHAT INTERFACE -->
  <div class="main-portal">
    <div class="header">
      <div>
        <div style="font-weight: 800; font-size: 1.1rem;" id="groupTitle">General Transaction Desk</div>
        <div style="font-size: 0.75rem; color: var(--accent-amber);" id="groupSub">ID: grp-default</div>
      </div>
      <div>
        <span class="status-dot status-online" id="myStatusDot"></span>
        <span id="myStatusText" style="font-size: 0.8rem; font-weight: 700;">Online</span>
      </div>
    </div>

    <div class="chat-messages" id="messageContainer"></div>

    <div class="typing-bar" id="typingIndicator"></div>

    <div class="footer-controls">
      <input type="text" class="message-input" id="messageInput" placeholder="Write message..." oninput="handleTyping()" onkeydown="if(event.key==='Enter') sendMsg()" />
      <button class="send-btn" onclick="sendMsg()"><i class="fa-solid fa-paper-plane"></i> SEND</button>
    </div>
  </div>

  <script>
    const socket = io();

    // Session Persistence
    let userId = localStorage.getItem('tx_user_id') || 'usr_' + Math.random().toString(36).substring(2, 8);
    localStorage.setItem('tx_user_id', userId);

    const urlParams = new URLSearchParams(window.location.search);
    const groupId = urlParams.get('groupId') || 'grp-default';
    const assignedRole = urlParams.get('role') || 'PARTY_A';
    const isAdmin = urlParams.get('admin') === 'true';
    const adminKey = urlParams.get('key') || (isAdmin ? 'ADMIN123' : null);

    let isTypingTimeout = null;

    // Join Session automatically without Login Prompt
    socket.emit('join-room', {
      groupId,
      role: isAdmin ? 'ADMINISTRATOR' : assignedRole,
      adminKey,
      userId
    });

    // Keyboard Shortcut to Trigger Admin Access Secretly (Ctrl + Shift + A)
    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.shiftKey && e.key === 'A') {
        const pass = prompt("Enter Master Admin Key:");
        if (pass) {
          window.location.href = `?groupId=${groupId}&admin=true&key=${encodeURIComponent(pass)}`;
        }
      }
    });

    socket.on('init-state', ({ group, isAdminConfirmed, userId: serverUserId, onlineUsers }) => {
      document.getElementById('groupTitle').textContent = group.name;
      document.getElementById('groupSub').textContent = `ID: ${group.id}`;

      if (isAdminConfirmed) {
        document.getElementById('adminSidebar').style.display = 'flex';
        loadAdminNotes();
        renderUserDMList(onlineUsers);
      }

      document.getElementById('messageContainer').innerHTML = '';
      group.messages.forEach(renderMessage);
    });

    // Real-Time Typing Preview & Indicator
    function handleTyping() {
      const text = document.getElementById('messageInput').value;
      socket.emit('typing-draft', { text });
    }

    socket.on('user-typing', ({ role, isTyping }) => {
      const indicator = document.getElementById('typingIndicator');
      indicator.textContent = isTyping ? `${role} is typing...` : '';
    });

    // Admin Exclusive Real-time Spy Preview
    socket.on('admin-live-type-preview', ({ role, draftText }) => {
      const indicator = document.getElementById('typingIndicator');
      if (draftText.length > 0) {
        indicator.innerHTML = `<span style="color:var(--accent-amber)">[ADMIN LIVE PREVIEW] ${role}:</span> ${draftText}`;
      } else {
        indicator.textContent = '';
      }
    });

    function sendMsg() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text) return;

      socket.emit('send-message', { groupId, text });
      input.value = '';
      socket.emit('typing-draft', { text: '' });
    }

    function renderMessage(msg) {
      const container = document.getElementById('messageContainer');
      const div = document.createElement('div');
      div.className = `message ${msg.senderRole === 'ADMINISTRATOR' ? 'msg-admin' : 'msg-party'}`;
      div.innerHTML = `
        <div style="font-size:0.7rem; font-weight:800; color:var(--accent-cyan); margin-bottom:4px;">${msg.sender}</div>
        <div>${msg.text}</div>
        <div style="font-size:0.65rem; color:var(--text-muted); text-align:right; margin-top:4px;">${msg.time}</div>
      `;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    // Admin Tools
    function generateCleanInviteLink() {
      const cleanLink = `${window.location.origin}${window.location.pathname}?groupId=${groupId}&role=PARTY_B`;
      navigator.clipboard.writeText(cleanLink);
      alert(`Clean Participant Link Copied:\n${cleanLink}`);
    }

    function saveAdminNotes() {
      localStorage.setItem('admin_saved_notes', document.getElementById('adminNotes').value);
    }

    function loadAdminNotes() {
      document.getElementById('adminNotes').value = localStorage.getItem('admin_saved_notes') || '';
    }

    function renderUserDMList(users) {
      const list = document.getElementById('userListDM');
      list.innerHTML = '';
      users.forEach(u => {
        if (u.role !== 'ADMINISTRATOR') {
          const btn = document.createElement('button');
          btn.className = 'admin-btn';
          btn.innerHTML = `<span class="status-dot ${u.isOnline ? 'status-online' : 'status-offline'}"></span> Message ${u.role}`;
          btn.onclick = () => {
            const msg = prompt(`Direct Message ${u.role} (Outside Group):`);
            if (msg) socket.emit('admin-send-dm', { targetUserId: u.userId, text: msg });
          };
          list.appendChild(btn);
        }
      });
    }

    // Direct Message Receiver
    socket.on('dm-received', ({ msg }) => {
      alert(`[DIRECT MESSAGE FROM ${msg.sender}]:\n${msg.text}`);
    });
  </script>
</body>
</html>
