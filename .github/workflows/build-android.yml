# Builds the signed Vistra Android app (with fingerprint unlock) automatically on GitHub — nothing to install on your computer.
# Run it: GitHub → Actions → "Build Vistra Android app" → Run workflow.
name: Build Vistra Android app
on:
  workflow_dispatch:
  push:
    paths: ['android-app/**', '.github/workflows/build-android.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Android SDK pieces
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null
      - name: Signing key
        env:
          KS_B64: ${{ secrets.VISTRA_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.VISTRA_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/vistra.keystore"; echo "KEYPASS=$KS_PASS" >> "$GITHUB_ENV"
            echo "Using your saved Vistra signing key."
          else
            PASS="$(openssl rand -hex 16)"
            keytool -genkeypair -keystore "$RUNNER_TEMP/vistra.keystore" -storetype PKCS12 -alias vistra -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=Vistra Secure Transaction Desk, O=Vistra, C=US" >/dev/null
            echo "KEYPASS=$PASS" >> "$GITHUB_ENV"
            echo "::warning::No saved signing key was found, so a one-time key was made. Add VISTRA_KEYSTORE_BASE64 and VISTRA_KEYSTORE_PASSWORD (see ANDROID-FINGERPRINT.md) so every future build uses the SAME key."
          fi
          echo "KEYSTORE=$RUNNER_TEMP/vistra.keystore" >> "$GITHUB_ENV"
      - name: Build the app
        run: bash android-app/build-sdk.sh
      - uses: actions/upload-artifact@v4
        with: { name: Vistra-apk, path: public/downloads/Vistra.apk }
      - name: Publish to the website (public/downloads/Vistra.apk)
        run: |
          git config user.name "vistra-build"; git config user.email "build@users.noreply.github.com"
          git add public/downloads/Vistra.apk
          git diff --cached --quiet || { git commit -m "Build Vistra Android app 1.1 (fingerprint unlock)"; git push; }
